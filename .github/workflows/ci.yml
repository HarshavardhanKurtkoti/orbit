name: CI - Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-ci:
    name: Frontend Quality & Build (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Web App
        run: pnpm --filter @orbit/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  api-ci:
    name: Backend Tests & Linting (FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit_user
          POSTGRES_PASSWORD: orbit_password
          POSTGRES_DB: orbit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Initialize & Seed Database
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://orbit_user:orbit_password@localhost:5432/orbit_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-orbit-ci-cd-3849gh34
        run: |
          python -m app.seed

      - name: Run Pytest Suite
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://orbit_user:orbit_password@localhost:5432/orbit_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-orbit-ci-cd-3849gh34
          AI_DEMO_MODE: "true"
        run: |
          pytest tests -v

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: orbit-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
